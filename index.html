<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECHOBOUND</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #080b12;
      font-family: Arial, sans-serif;
      color: white;
    }

    #menu {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;

      background:
        radial-gradient(circle at center, #182536 0%, #080b12 55%, #030509 100%);
    }

    .container {
      width: 90%;
      max-width: 430px;
    }

    .logo {
      font-size: clamp(42px, 12vw, 72px);
      font-weight: 900;
      letter-spacing: 8px;
      text-shadow: 0 0 30px rgba(150, 210, 255, 0.35);
    }

    .subtitle {
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 5px;
      opacity: 0.45;
    }

    .core {
      width: 100px;
      height: 100px;
      margin: 40px auto;

      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      animation: pulse 3s infinite;
    }

    .core::before {
      content: "";
      position: absolute;
      width: 65px;
      height: 65px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%;
    }

    .dot {
      width: 9px;
      height: 9px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 20px white;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      padding: 17px;
      border-radius: 12px;

      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);

      color: white;
      font-size: 14px;
      letter-spacing: 2px;

      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: rgba(255,255,255,0.12);
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.98);
    }

    .story {
      border-color: rgba(180,220,255,0.3);
    }

    .online {
      opacity: 0.65;
    }

    .version {
      margin-top: 25px;
      font-size: 9px;
      letter-spacing: 3px;
      opacity: 0.3;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.5;
      }

      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div id="menu">

    <div class="container">

      <div class="logo">
        ECHOBOUND
      </div>

      <div class="subtitle">
        THE FIRST ECHO
      </div>

      <div class="core">
        <div class="dot"></div>
      </div>

      <div class="buttons">

        <button class="story" onclick="story()">
          📖 MODO HISTORIA
        </button>

        <button class="online" onclick="online()">
          🌎 MODO ONLINE
        </button>

        <button onclick="settings()">
          ⚙️ AJUSTES
        </button>

      </div>

      <div class="version">
        ECHOBOUND v0.2.0
      </div>

    </div>

  </div>

  <script>

    function story() {
      alert("📖 MODO HISTORIA\n\nPróximamente comienza tu aventura...");
    }

    function online() {
      alert("🌎 MODO ONLINE\n\nEl mundo multiplayer está en desarrollo.");
    }

    function settings() {
      alert("⚙️ AJUSTES\n\nPersonalización próximamente.");
    }

  </script>

</body>
</html>
